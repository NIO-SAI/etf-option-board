# ETF 期权日内决策看板 — Docker Compose 一键部署
#
# 默认拉取 Docker Hub 镜像并启动，打开 http://<主机IP>:6799：
#   docker compose pull
#   docker compose up -d --no-build
#   docker compose logs -f        # 看日志
# 如需从当前源码构建，在完整源码仓库根目录执行 docker compose up -d --build。
#
# 可选配置写在同目录的 .env（已 gitignore），例如：
#   ETF_IMAGE=vissong/etf-option-board:latest     # 默认镜像；可覆盖为其他仓库地址或本地镜像名
#   ETF_PORT=6799                                 # 宿主机端口
#   LLM_API_KEY=...                               # 大模型决策用的 opencode key；不填则该功能显示不可用
#
# 使用已发布的自有镜像：在 .env 设置 ETF_IMAGE，再执行
#   docker compose pull && docker compose up -d --no-build
# 多架构构建与推送方法见 README「Docker 部署」。

services:
  etf-option-board:
    image: ${ETF_IMAGE:-vissong/etf-option-board:latest}
    build: .
    container_name: etf-option-board
    # /api/admin/restart 退出进程后由它拉起，相当于原来的 LaunchAgent
    restart: unless-stopped
    ports:
      # /api/admin/* 没有鉴权；只想本机访问就改成 "127.0.0.1:${ETF_PORT:-6799}:6799"
      - "${ETF_PORT:-6799}:6799"
    environment:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      # 设置、自选、板块库、分钟线累积都在这里，重建容器不丢
      - etf-data:/app/data

volumes:
  etf-data:
